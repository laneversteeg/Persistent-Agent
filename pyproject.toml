[project]
name = "persistent-agent"
version = "0.1.0"
description = "An always-on, goal-based agent template for Managed Deep Agents."
requires-python = ">=3.11"
dependencies = [
    "managed-deepagents==0.10.5",
    "langchain-openai",  # also runs langsmith: (LLM Gateway) models
    "langchain-anthropic",
    "httpx",
    "emoji-data-python>=1.6.0",
]

[dependency-groups]
dev = ["ruff"]

[tool.mda]
python-version = "3.13"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP017"]
